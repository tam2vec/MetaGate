name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install PyYAML
      - run: PYTHONPATH=src:. python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python scripts/evaluate_benchmark.py

  live-datahub-schema:
    name: live DataHub schema contract
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install PyYAML acryl-datahub
      - name: Start DataHub quickstart
        env:
          DATAHUB_TOKEN_SERVICE_SIGNING_KEY: ${{ secrets.DATAHUB_TOKEN_SERVICE_SIGNING_KEY }}
          DATAHUB_TOKEN_SERVICE_SALT: ${{ secrets.DATAHUB_TOKEN_SERVICE_SALT }}
        run: |
          export DATAHUB_TOKEN_SERVICE_SIGNING_KEY="${DATAHUB_TOKEN_SERVICE_SIGNING_KEY:-$(openssl rand -hex 32)}"
          export DATAHUB_TOKEN_SERVICE_SALT="${DATAHUB_TOKEN_SERVICE_SALT:-$(openssl rand -hex 16)}"
          datahub docker quickstart
      - name: Ingest DataHub sample metadata
        run: datahub docker ingest-sample-data
      - name: Run live schema contract
        env:
          DATAHUB_GRAPHQL_URL: http://localhost:8080/api/graphql
          METAGATE_LIVE_DATAHUB_URN: urn:li:dataset:(urn:li:dataPlatform:hive,SampleHiveDataset,PROD)
        run: PYTHONPATH=src:. python -m unittest tests.test_datahub_schema -v
      - name: Collect DataHub logs on failure
        if: failure()
        run: docker compose -p datahub logs --no-color --tail=300 || true
