<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Predicate architecture</title>
  <desc id="desc">DataHub metadata events flow through graph traversal, deterministic policy evaluation, readiness and confidence scoring, capability certification, context contracts, history, and write-back.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#356ae6"/>
    </marker>
    <style>
      .box { fill: #f7f9fc; stroke: #263449; stroke-width: 2; rx: 10; }
      .accent { fill: #e8f0ff; stroke: #356ae6; }
      .text { fill: #172033; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; text-anchor: middle; }
      .small { font-size: 15px; }
      .line { stroke: #356ae6; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <rect class="box accent" x="465" y="24" width="270" height="58"/>
  <text class="text" x="600" y="60">DataHub</text>
  <path class="line" d="M600 82 V125"/>
  <rect class="box" x="430" y="125" width="340" height="58"/>
  <text class="text" x="600" y="161">Metadata change events</text>
  <path class="line" d="M600 183 V226"/>
  <rect class="box accent" x="430" y="226" width="340" height="58"/>
  <text class="text" x="600" y="262">Predicate scanner</text>
  <path class="line" d="M600 284 V327"/>
  <rect class="box" x="430" y="327" width="340" height="58"/>
  <text class="text" x="600" y="352">Multi-hop evidence collector</text>
  <text class="text small" x="600" y="373">graph, ownership, lineage, quality, usage</text>
  <path class="line" d="M430 356 H230"/>
  <path class="line" d="M770 356 H970"/>
  <rect class="box" x="45" y="327" width="310" height="58"/>
  <text class="text" x="200" y="363">Graph coverage and cache</text>
  <rect class="box" x="845" y="327" width="310" height="58"/>
  <text class="text" x="1000" y="363">Deterministic policy engine</text>
  <path class="line" d="M600 385 V428"/>
  <rect class="box accent" x="430" y="428" width="340" height="58"/>
  <text class="text" x="600" y="464">Readiness and confidence</text>
  <path class="line" d="M430 457 H230"/>
  <path class="line" d="M770 457 H970"/>
  <rect class="box" x="45" y="428" width="310" height="58"/>
  <text class="text" x="200" y="464">Gaps and business impact</text>
  <rect class="box" x="845" y="428" width="310" height="58"/>
  <text class="text" x="1000" y="464">Capability certification</text>
  <path class="line" d="M600 486 V529"/>
  <rect class="box accent" x="350" y="529" width="500" height="58"/>
  <text class="text" x="600" y="565">Predicate Certificate and Context Contract</text>
  <path class="line" d="M850 558 H1080 V183 H770"/>
  <text class="text small" x="1010" y="178">write back and rescan</text>
</svg>
