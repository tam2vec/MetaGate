<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Predicate demo sequence</title>
  <desc id="desc">An AI action is blocked, explained, repaired through metadata, rescanned, and certified.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#356ae6"/></marker>
    <style>
      .panel { fill: #f7f9fc; stroke: #263449; stroke-width: 2; }
      .num { fill: #356ae6; }
      .text { fill: #172033; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .title { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .arrow { stroke: #356ae6; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="330" fill="#fff"/>
  <g transform="translate(20 55)"><rect class="panel" width="170" height="180" rx="12"/><circle class="num" cx="28" cy="30" r="17"/><text class="text" fill="#fff" x="28" y="36">1</text><text class="text title" x="85" y="75">AI request</text><text class="text body" x="85" y="110">Rename revenue</text><text class="text body" x="85" y="132">to net_revenue</text></g>
  <path class="arrow" d="M195 145 H220"/>
  <g transform="translate(225 55)"><rect class="panel" width="170" height="180" rx="12"/><circle class="num" cx="28" cy="30" r="17"/><text class="text" fill="#fff" x="28" y="36">2</text><text class="text title" x="85" y="75">Blocked</text><text class="text body" x="85" y="110">Capability is</text><text class="text body" x="85" y="132">not certified</text></g>
  <path class="arrow" d="M400 145 H425"/>
  <g transform="translate(430 55)"><rect class="panel" width="170" height="180" rx="12"/><circle class="num" cx="28" cy="30" r="17"/><text class="text" fill="#fff" x="28" y="36">3</text><text class="text title" x="85" y="75">Explain</text><text class="text body" x="85" y="110">Lineage incomplete</text><text class="text body" x="85" y="132">16 consumers known</text></g>
  <path class="arrow" d="M605 145 H630"/>
  <g transform="translate(635 55)"><rect class="panel" width="170" height="180" rx="12"/><circle class="num" cx="28" cy="30" r="17"/><text class="text" fill="#fff" x="28" y="36">4</text><text class="text title" x="85" y="75">Repair</text><text class="text body" x="85" y="110">Add lineage</text><text class="text body" x="85" y="132">and approval</text></g>
  <path class="arrow" d="M810 145 H835"/>
  <g transform="translate(840 55)"><rect class="panel" width="170" height="180" rx="12"/><circle class="num" cx="28" cy="30" r="17"/><text class="text" fill="#fff" x="28" y="36">5</text><text class="text title" x="85" y="75">Rescan</text><text class="text body" x="85" y="110">Event triggers</text><text class="text body" x="85" y="132">graph reassessment</text></g>
  <path class="arrow" d="M1015 145 H1040"/>
  <g transform="translate(1045 55)"><rect class="panel" width="135" height="180" rx="12"/><circle class="num" cx="28" cy="30" r="17"/><text class="text" fill="#fff" x="28" y="36">6</text><text class="text title" x="67" y="75">Allowed</text><text class="text body" x="67" y="110">Capability</text><text class="text body" x="67" y="132">certified</text></g>
</svg>
