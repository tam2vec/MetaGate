[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predicate"
version = "0.1.0"
description = "Metadata-backed AI admission control for DataHub."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Predicate Contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5", "PyYAML>=6.0"]
datahub = ["requests>=2.31"]

[project.scripts]
predicate = "context_gradient.cli:main"
context-gradient = "context_gradient.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
