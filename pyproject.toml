[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metagate"
version = "0.1.0"
description = "Metadata-backed AI admission control for DataHub."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "MetaGate Contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5", "PyYAML>=6.0"]
datahub = ["requests>=2.31", "acryl-datahub>=1.3"]

[project.scripts]
metagate = "context_gradient.cli:main"
metagate-review = "metagate.review:main"
context-gradient = "context_gradient.cli:main"
metagate-mcp = "metagate.mcp_server:main"
metagate-doctor = "metagate.doctor:main"
metagate-skill = "context_gradient.skill:main"
metagate-datahub-mcp-probe = "metagate.datahub_mcp_probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
